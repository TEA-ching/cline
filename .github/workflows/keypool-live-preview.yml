name: keypool-live — Preview Release

on:
  push:
    branches:
      - keypool-live

# Cancel any in-flight run for the same ref so only the latest commit gets published.
concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Compute shared metadata (version + datetime) once, shared across all jobs.
  # ─────────────────────────────────────────────────────────────────────────────
  setup:
    name: Compute build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      datetime: ${{ steps.meta.outputs.datetime }}
      # datetime_safe: colons replaced by '-' — required for Windows filenames
      # and for git tag names (colons are not allowed in refs).
      datetime_safe: ${{ steps.meta.outputs.datetime_safe }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute version and datetime
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/vscode/package.json').version")
          DATETIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATETIME_SAFE=$(echo "$DATETIME" | tr ':' '-')
          echo "version=$VERSION"             >> "$GITHUB_OUTPUT"
          echo "datetime=$DATETIME"           >> "$GITHUB_OUTPUT"
          echo "datetime_safe=$DATETIME_SAFE" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build a platform-specific VSIX for each target.
  #    vscode:prepublish handles compilation + better-sqlite3 rebuild automatically.
  # ─────────────────────────────────────────────────────────────────────────────
  build-vsix:
    name: VSIX ${{ matrix.platform }}-${{ matrix.arch }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            native_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            native_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            native_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            native_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: armhf
            # prebuild-install uses 'arm' (not 'armhf') for the ARM v7 prebuilt
            native_arch: arm
          - os: ubuntu-latest
            platform: alpine
            arch: x64
            # No musl prebuilt for better-sqlite3; linux-x64 glibc binary is used.
            # The extension degrades gracefully when the native module fails to load.
            native_arch: x64
          - os: macos-26-intel
            platform: darwin
            arch: x64
            native_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            native_arch: arm64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: apps/vscode

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          # Keep aligned with the nightly publish workflow.
          # Node 24 / npm 11 can cause ELSPROBLEMS with `npm list` during vsce packaging.
          node-version: "22"

      - name: Patch VSIX package metadata for SCTG
        run: |
          jq '.publisher = "sctg-development" |
              .repository.url = "https://github.com/TEA-ching/cline" |
              .homepage = "https://github.com/TEA-ching/cline" |
              .author.name = "Cline Bot Inc. & Ronan Le Meillat - SCTG Development"' package.json > package.json.tmp && mv package.json.tmp package.json
        shell: bash

      - name: Patch AboutSection build date
        env:
          BUILD_DATETIME: ${{ needs.setup.outputs.datetime }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('webview-ui/src/components/settings/sections/AboutSection.tsx')
          text = path.read_text(encoding='utf-8')
          build_date = os.environ['BUILD_DATETIME']

          pattern = re.compile(
              r'(<h2[^>]*id="about_title"[^>]*>.*?</h2>)(?:\s*<p[^>]*className="text-xs"[^>]*>.*?</p>)?',
              re.S,
          )

          def repl(match):
              h2 = match.group(1)
              build_line = f'<p className="text-xs">Build date: {build_date}</p>'
              return f"{h2}\n\t\t\t\t\t{build_line}"

          new_text, count = pattern.subn(repl, text, count=1)
          if count != 1:
              raise SystemExit('Failed to patch AboutSection.tsx: could not find the about_title header')
          path.write_text(new_text, encoding='utf-8')
          PY
        shell: bash

      - name: Install @vscode/vsce globally
        run: npm install -g @vscode/vsce
        shell: bash

      # workflow tested with `rm -rf cline && git clone https://github.com/cline/cline.git && cd cline && bun install && bun run build && bun run build:models && bun run build:sdk && cd apps/vscode && bun install && bun run protos && cd webview-ui && npm install && cd .. && npx vcse package & cd ../..`
      - name: Install root dependencies
        working-directory: .
        run: bun install --include=optional
        shell: bash

      - name: Build root packages and CLI (to ensure vsce can find the built CLI for packaging)
        working-directory: .
        shell: bash
        run: |
          bun run build
          bun run build:models
          bun run build:sdk

      - name: Install VSCode extension dependencies
        working-directory: apps/vscode
        run: bun install
        shell: bash

      - name: Build VSCode protos
        working-directory: apps/vscode
        run: bun run protos
        shell: bash

      - name: Install VSCode extension webview UI dependencies
        working-directory: apps/vscode/webview-ui
        run: npm install
        shell: bash

      - name: Build and Package VSIX
        # vsce triggers vscode:prepublish → `npm run rebuild:native && npm run package`
        # rebuild:native reads VSCODE_ELECTRON_VERSION and TARGET_ARCH.
        env:
          VSCODE_ELECTRON_VERSION: "42.2.0"
          TARGET_ARCH: ${{ matrix.native_arch }}
        run: |
          node scripts/rebuild-native-for-vscode.mjs
          npx vsce package \
            --target ${{ matrix.platform }}-${{ matrix.arch }} \
            --allow-package-secrets sendgrid \
            --out "clinepool-${{ needs.setup.outputs.version }}-preview-${{ needs.setup.outputs.datetime_safe }}-${{ matrix.platform }}-${{ matrix.arch }}.vsix"
        shell: bash

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.platform }}-${{ matrix.arch }}
          path: "apps/vscode/clinepool-*.vsix"
          if-no-files-found: error


  # ─────────────────────────────────────────────────────────────────────────────
  # 3.5. Build CLI binaries for all platforms
  # ─────────────────────────────────────────────────────────────────────────────
  build-cli-and-sdk:
    name: Build CLI and SDK
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC when fetching private dependencies with authentication
    steps:
      # - name: Install deps
      #   run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev 

      - uses: actions/checkout@v6

      - name: Create fake gitleaks in /usr/bin to prevent build failures if gitleaks is not installed on the runner.
        run: |
          echo -e '#!/bin/bash\nexit 0' | sudo tee /usr/bin/gitleaks > /dev/null
          sudo chmod +x /usr/bin/gitleaks

      - name: Create fake lint-staged in /usr/bin to prevent build failures if lint-staged is not installed on the runner.
        run: |
          echo -e '#!/bin/bash\nexit 0' | sudo tee /usr/bin/lint-staged > /dev/null
          sudo chmod +x /usr/bin/lint-staged

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename SDK package scope for SCTG publish
        run: |
          node <<'NODE'
          /**
           * This script renames all @cline/ package references to @sctg/cline-*
           * for publishing to the SCTG npm registry.
           * This ensures proper scoping and namespace isolation for the preview release.
           */

          const fs = require('node:fs')
          const path = require('node:path')

          const root = process.cwd()
          const sdkDir = path.join(root, 'sdk')
          const docsDir = path.join(root, 'docs')
          const agentsDir = path.join(root, '.agents')
          const ignoredDirs = new Set([
            'node_modules',
            '.git',
            'dist',
            '.turbo',
            '.next',
          ])

          /**
           * Maps @cline/ package names to @sctg/cline-* format
           * @param {string} name - The original package name
           * @returns {string} The mapped package name with SCTG scope
           */
          function mapClineName(name) {
            if (typeof name !== 'string') return name
            if (!name.startsWith('@cline/')) return name
            return `@sctg/cline-${name.slice('@cline/'.length)}`
          }

          /**
           * Recursively finds all files with a specific extension in a directory
           * @param {string} dir - The directory to search
           * @param {string} extension - The file extension to find
           * @param {string[]} acc - Accumulator for found files
           * @returns {string[]} Array of file paths matching the extension
           */
          function findFilesByExtension(dir, extension, acc = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!ignoredDirs.has(entry.name)) {
                  findFilesByExtension(path.join(dir, entry.name), extension, acc)
                }
                continue
              }
              if (entry.isFile() && entry.name.endsWith(extension)) {
                acc.push(path.join(dir, entry.name))
              }
            }
            return acc
          }

          /**
           * Recursively finds all files in a directory (excluding ignored directories)
           * @param {string} dir - The directory to search
           * @param {string[]} acc - Accumulator for found files
           * @returns {string[]} Array of all file paths found
           */
          function findAllFiles(dir, acc = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!ignoredDirs.has(entry.name)) {
                  findAllFiles(path.join(dir, entry.name), acc)
                }
                continue
              }
              if (entry.isFile()) {
                acc.push(path.join(dir, entry.name))
              }
            }
            return acc
          }

          /**
           * Replaces all @cline/ package references with @sctg/cline-* equivalents
           * - also updates any docs.cline.bot references to docs.ai-ml.pp.ua
           * - also updates any https://github.com/cline/cline.git to the repository URL for trusted publishing provenance
           * @param {string} content - The file content to process
           * @returns {string} Content with package references updated
           */
          function replaceClineReferences(content) {
            return content
              .replace(/@cline\/([a-zA-Z][a-zA-Z0-9-]*)/g, '@sctg/cline-$1')
              .replace(/docs\.cline\.bot/g, 'docs.ai-ml.pp.ua')
              .replace(/https:\/\/github\.com\/cline\/cline\.git/g, `${repositoryUrl}.git`)
              .replace(/https:\/\/github\.com\/cline\/cline/g, `${repositoryUrl}`)
              .replace(/https:\/\/marketplace\.visualstudio\.com\/items\?itemName=saoudrizwan\.claude-dev/g, `${repositoryUrl}/releases`)
              .replace(/npm i -g cline/g, 'https://github.com/TEA-ching/cline/releases')
              .replace(/npx skills add cline\/sdk-skill/g, 'npx skills add https://github.com/TEA-ching/cline/tree/keypool-docs-deploy/.agents/skills/cline-sdk')
          }

          // Get repository information for setting package repository URLs
          const githubRepository = process.env.GITHUB_REPOSITORY
          const githubServerUrl = process.env.GITHUB_SERVER_URL || 'https://github.com'
          const repositoryUrl = githubRepository
            ? `${githubServerUrl}/${githubRepository}`
            : null

          // List of package.json dependency fields to process
          const keysToRewrite = [
            'dependencies',
            'devDependencies',
            'peerDependencies',
            'optionalDependencies',
          ]

          // Update package.json files - this is the primary transformation
          const packageJsonFiles = findFilesByExtension(root, 'package.json')
          let touched = 0

          for (const pkgPath of packageJsonFiles) {
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))

            // Update package name if it's a @cline/ package
            const oldName = pkg.name
            const mappedName = mapClineName(oldName)
            if (mappedName !== oldName) {
              pkg.name = mappedName
            }

            // Update all dependency fields
            for (const key of keysToRewrite) {
              if (!pkg[key] || typeof pkg[key] !== 'object') {
                continue
              }
              const rewritten = {}
              for (const [depName, depVersion] of Object.entries(pkg[key])) {
                rewritten[mapClineName(depName)] = depVersion
              }
              pkg[key] = rewritten
            }

            // Set repository URL for trusted publishing provenance
            if (repositoryUrl) {
              if (typeof pkg.repository === 'string') {
                pkg.repository = repositoryUrl
              } else if (pkg.repository && typeof pkg.repository === 'object') {
                pkg.repository.url = repositoryUrl
              } else {
                pkg.repository = {
                  type: 'git',
                  url: repositoryUrl,
                }
              }
            }

            // Write updated package.json with consistent formatting.
            // Also run replaceClineReferences on the serialized JSON to catch
            // any remaining @cline/ references in scripts, bin, exports, etc.
            const serialized = replaceClineReferences(JSON.stringify(pkg, null, '\t'))
            fs.writeFileSync(pkgPath, `${serialized}\n`)
            touched++
          }

          // apps/{cli,cline-hub,examples} were moved from sdk/apps/ to apps/ at root.
          // They must be scanned for @cline/ refs just like sdk/ was before.
          // apps/vscode/ is intentionally excluded: the extension source keeps @cline/* as-is.
          const appsCliDir = path.join(root, 'apps/cli')
          const appsClineHubDir = path.join(root, 'apps/cline-hub')
          const appsExamplesDir = path.join(root, 'apps/examples')

          // Update README.md files to ensure documentation references correct package names
          const readmeFiles = findFilesByExtension(sdkDir, 'README.md')
            .concat(fs.existsSync(appsCliDir) ? findFilesByExtension(appsCliDir, 'README.md') : [])
            .concat(fs.existsSync(appsClineHubDir) ? findFilesByExtension(appsClineHubDir, 'README.md') : [])
            .concat(fs.existsSync(appsExamplesDir) ? findFilesByExtension(appsExamplesDir, 'README.md') : [])
          for (const readmePath of readmeFiles) {
            let content = fs.readFileSync(readmePath, 'utf8')
            const originalContent = content
            content = replaceClineReferences(content)

            if (content !== originalContent) {
              fs.writeFileSync(readmePath, content)
              console.log(`Updated package references in ${readmePath}`)
            }
          }

          // Update all other files (source code, config files, etc.) to ensure consistency
          const allFiles = findAllFiles(sdkDir)
            .concat(findAllFiles(docsDir))
            .concat(findAllFiles(agentsDir))
            .concat(fs.existsSync(appsCliDir) ? findAllFiles(appsCliDir) : [])
            .concat(fs.existsSync(appsClineHubDir) ? findAllFiles(appsClineHubDir) : [])
            .concat(fs.existsSync(appsExamplesDir) ? findAllFiles(appsExamplesDir) : [])
          for (const filePath of allFiles) {
            // Skip package.json and README.md files as they were already processed
            if (filePath.endsWith('package.json') || filePath.endsWith('README.md')) {
              continue
            }

            let content = fs.readFileSync(filePath, 'utf8')
            const originalContent = content
            content = replaceClineReferences(content)

            if (content !== originalContent) {
              fs.writeFileSync(filePath, content)
              console.log(`Updated package references in ${filePath}`)
            }
          }

          // Log summary of changes made
          console.log(`Rewrote ${touched} file(s): @cline/* -> @sctg/cline-*`)
          if (repositoryUrl) {
            console.log(`Set repository.url to ${repositoryUrl} for trusted publishing provenance`)
          }
          console.log('Updated @cline/ package references in all repository files')
          NODE


      - name: Build CLI binaries
        run: |
          bun install
          bun run build:models
          bun run build:sdk
          cd apps/cli
          bun run build
          bun run build:platforms

      - name: Upload CLI binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: |
            apps/cli/dist/cli-windows-arm64/bin/cline.exe
            apps/cli/dist/cli-windows-x64/bin/cline.exe
            apps/cli/dist/cli-linux-arm64/bin/cline
            apps/cli/dist/cli-darwin-arm64/bin/cline
            apps/cli/dist/cli-linux-x64/bin/cline
            apps/cli/dist/cli-darwin-x64/bin/cline
          if-no-files-found: error

      - name: Version SDK packages (preview semver)
        working-directory: sdk
        run: |
          # Build a semver prerelease suffix in the form: -beta.YYYYMMDDHHMMSS
          # 2026-05-24T01-55-05Z -> 20260524015505
          SEMVER_TAG=$(echo "${{ needs.setup.outputs.datetime_safe }}" | tr -cd '0-9')
          SDK_VERSION="${{ needs.setup.outputs.version }}-beta.${SEMVER_TAG}"
          echo "SDK preview version: $SDK_VERSION"
          bun scripts/version.ts "$SDK_VERSION"

      - name: Refresh Bun workspace lockfile after package renaming
        working-directory: sdk
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack all SDK packages
        working-directory: sdk
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-packs"
          for PKG in shared llms agents core sdk; do
            cd "packages/$PKG"
            bun pm pack --destination "$RUNNER_TEMP/sdk-packs" --quiet
            cd ../..
          done

      - name: Bundle SDK packs into single archive
        working-directory: sdk
        run: |
          BUNDLE="clinepool-${{ needs.setup.outputs.version }}-preview-${{ needs.setup.outputs.datetime_safe }}.tar.gz"
          tar -czf "$RUNNER_TEMP/$BUNDLE" -C "$RUNNER_TEMP/sdk-packs" .
          # Copy to workspace root so upload-artifact (which resolves from GITHUB_WORKSPACE) can find it
          cp "$RUNNER_TEMP/$BUNDLE" "$GITHUB_WORKSPACE/$BUNDLE"

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          # Path is resolved from GITHUB_WORKSPACE (not the job's working-directory)
          name: sdk-bundle
          path: "${{ github.workspace }}/clinepool-*-preview-*.tar.gz"
          if-no-files-found: error

      - name: Prepare npm publish tarball directory
        working-directory: sdk
        run: mkdir -p "$RUNNER_TEMP/sdk-npm-packs"

      - name: Publish @sctg/cline-shared
        working-directory: sdk
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Missing NPMJS_TOKEN secret"
            exit 1
          fi
          cd packages/shared
          TARBALL=$(bun pm pack --destination "$RUNNER_TEMP/sdk-npm-packs" --quiet)
          npm publish "$RUNNER_TEMP/sdk-npm-packs/$(basename "$TARBALL")" --tag latest --access public

      - name: Publish @sctg/cline-llms
        working-directory: sdk
        run: |
          cd packages/llms
          TARBALL=$(bun pm pack --destination "$RUNNER_TEMP/sdk-npm-packs" --quiet)
          npm publish "$RUNNER_TEMP/sdk-npm-packs/$(basename "$TARBALL")" --tag latest --access public

      - name: Publish @sctg/cline-agents
        working-directory: sdk
        run: |
          cd packages/agents
          TARBALL=$(bun pm pack --destination "$RUNNER_TEMP/sdk-npm-packs" --quiet)
          npm publish "$RUNNER_TEMP/sdk-npm-packs/$(basename "$TARBALL")" --tag latest --access public

      - name: Publish @sctg/cline-core
        working-directory: sdk
        run: |
          cd packages/core
          TARBALL=$(bun pm pack --destination "$RUNNER_TEMP/sdk-npm-packs" --quiet)
          npm publish "$RUNNER_TEMP/sdk-npm-packs/$(basename "$TARBALL")" --tag latest --access public

      - name: Publish @sctg/cline-sdk
        working-directory: sdk
        run: |
          cd packages/sdk
          TARBALL=$(bun pm pack --destination "$RUNNER_TEMP/sdk-npm-packs" --quiet)
          npm publish "$RUNNER_TEMP/sdk-npm-packs/$(basename "$TARBALL")" --tag latest --access public

      - name: Clean before
        run: |
          find . -type d \( -name "node_modules" -o -name ".bun" -o -name "dist" \) -prune -exec rm -rf '{}' + || true

      - name: Deploy the skills to Mintlify
        run: |
          #deploy the sdk skills
          mkdir -p .mintlify/skills
          mkdir -p docs/.mintlify/skills
          cp -av .agents/skills/* .mintlify/skills/
          cp -av .agents/skills/* docs/.mintlify/skills/
          
      - name: Push modified docs to Mintlify deploy branch
        #working-directory: docs
        run: |
          git config user.email "ronan+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # ensure no node_modules or other ignored content is accidentally included in the deploy branch
          rm -rf node_modules dist .turbo .next 
          # Snapshot the already-renamed docs/ content
          DOCS_TMP=$(mktemp -d)
          rsync -av --exclude='.git' . "$DOCS_TMP/"
          # Create an orphan branch containing only the docs content at root
          # so Mintlify can be configured without a monorepo subdirectory.
          # IMPORTANT: git rm must run from the repo root (not docs/ CWD) to clear the
          # entire index — otherwise git checkout --orphan leaves all non-docs files
          # (apps/, .agents/, sdk/, …) staged with their pre-rename content, causing
          # unreplaced @cline/ references to appear in the deploy branch.
          REPO_ROOT=$(git rev-parse --show-toplevel)
          git checkout --orphan keypool-docs-deploy
          git -C "$REPO_ROOT" rm -rf . --quiet 2>/dev/null || true
          cp -r "$DOCS_TMP/." "$REPO_ROOT/"
          git -C "$REPO_ROOT" add .
          git -C "$REPO_ROOT" commit -m "deploy: preview docs [${{ needs.setup.outputs.datetime }}] ${{ github.sha }}"
          git push origin keypool-docs-deploy --force

      - name: Upload local repo to Artifact
        uses: actions/upload-artifact@v7
        with:
          name: modified-repo
          path: . 

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Gather artifacts, generate release notes, and publish a GitHub pre-release.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub pre-release
    needs: [setup, build-vsix, build-cli-and-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes from recent commits
        run: |
          # Commits since the previous preview tag on this branch (or last 30)
          PREV=$(git tag --sort=-creatordate --list 'preview/*' | head -1 || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges --pretty=format:"- %s (%h)" "${PREV}..HEAD")
          else
            LOG=$(git log --oneline --no-merges --pretty=format:"- %s (%h)" -30)
          fi
          {
            printf "**Branch:** \`keypool-live\`  **Commit:** \`%s\`\n\n" "${{ github.sha }}"
            printf "### Changes\n\n"
            echo "$LOG"
          } > release-notes.md
          echo "--- Release notes preview ---"
          cat release-notes.md

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: release-assets/
          merge-multiple: true

      - name: Download SDK artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-bundle
          path: sdk-artifact/

      - name: Move SDK artifact alongside VSIXes
        run: mv sdk-artifact/clinepool-*.tar.gz release-assets/

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          name: cli-binaries
          path: cli-binaries/

      - name: Rename CLI binaries with version and datetime
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          DATETIME_SAFE: ${{ needs.setup.outputs.datetime_safe }}
        run: |
          mkdir -p release-assets/cli
          # Rename Windows binaries
          mv cli-binaries/cli-windows-arm64/bin/cline.exe "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-windows-arm64.exe"
          mv cli-binaries/cli-windows-x64/bin/cline.exe "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-windows-x64.exe"

          # Rename Linux binaries
          mv cli-binaries/cli-linux-arm64/bin/cline "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-linux-arm64"
          mv cli-binaries/cli-linux-x64/bin/cline "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-linux-x64"

          # Rename macOS binaries
          mv cli-binaries/cli-darwin-arm64/bin/cline "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-darwin-arm64"
          mv cli-binaries/cli-darwin-x64/bin/cline "release-assets/cli/clinepool-cli-${VERSION}-preview-${DATETIME_SAFE}-darwin-x64"

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DATETIME: ${{ needs.setup.outputs.datetime }}
          DATETIME_SAFE: ${{ needs.setup.outputs.datetime_safe }}
        run: |
          TAG="preview/${DATETIME_SAFE}"
          TITLE="ClinePool Preview ${DATETIME}"

          gh release create "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes-file release-notes.md \
            release-assets/*.vsix \
            release-assets/*.tar.gz \
            release-assets/cli/*
