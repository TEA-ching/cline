name: Deploy chatbot on cloudflare pages

on:
  push:
    branches:
      - keypool-live
    paths:
      - apps/chatbot/**
      - sdk/**
      - .github/workflows/deploy-chatbot-cloudflare-pages.yaml

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write
  attestations: write

jobs:
  datetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Compute version and datetime
        id: meta
        run: |
          SDK_VERSION=$(node -p "require('./sdk/packages/sdk/package.json').version")
          DATETIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATETIME_SAFE=$(echo "$DATETIME" | tr ':' '-')
          echo "sdk_version=$SDK_VERSION"     >> "$GITHUB_OUTPUT"
          echo "datetime=$DATETIME"           >> "$GITHUB_OUTPUT"
          echo "datetime_safe=$DATETIME_SAFE" >> "$GITHUB_OUTPUT"
          echo "sdk_version_datetime=$SDK_VERSION-$DATETIME_SAFE" >> "$GITHUB_OUTPUT"
  build:
    needs: datetime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun i

      - name: Build
        run: |
          bun run build:sdk
          cd apps/chatbot
          export KEYPOOL_VAULT_URL=${{ secrets.KEYPOOL_VAULT_URL }}
          export KEYPOOL_USAGE_DB_DIR=${{ secrets.KEYPOOL_USAGE_DB_DIR }} 
          export GITHUB_CLIENT_ID=${{ secrets._GITHUB_CLIENT_ID }} 
          export _GITHUB_CLIENT_ID=${{ secrets._GITHUB_CLIENT_ID }}
          export SDK_VERSION=${{ steps.meta.outputs.sdk_version }}
          export SDK_VERSION_DATETIME=${{ steps.meta.outputs.sdk_version_datetime }}
          bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy  --project-name=chatbot --branch=main  --commit-dirty=true apps/chatbot/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      