name: Deploy chatbot on cloudflare pages

on:
  push:
    branches:
      - keypool-live
    paths:
      - apps/chatbot/**
      - .github/workflows/deploy-chatbot-cloudflare-pages.yaml

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun i

      - name: Build
        run: |
          bun run build:sdk
          cd apps/chatbot
          export KEYPOOL_VAULT_URL=${{ secrets.KEYPOOL_VAULT_URL }}
          bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/chatbot/dist --project-name=chatbot --branch=main --commit-sha=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}" --commit-author="${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>" --commit-date="${{ github.event.head_commit.timestamp }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      