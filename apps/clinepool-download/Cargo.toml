[package]
name = "clinepool-download"
version = "0.1.0"
edition = "2024"

[lib]
name = "clinepool_download"
path = "src/lib.rs"

[[bin]]
name = "clinepool-download"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
thiserror = "2.0.18"
log = "0.4.27"
env_logger = "0.11.10"
octocrab = "0.53.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
chrono = "0.4.38"
bytes = "1.0"

[dev-dependencies]
mockito = "1.7.2"
tokio-test = "0.4.0"
bytes = "1.0"
